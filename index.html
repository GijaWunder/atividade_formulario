<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Exemplo </title>
    
        <link rel="stylesheet" href="styles.css">

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/froala-editor@4.6.2/css/froala_editor.pkgd.min.css">

        <script src="https://cdn.jsdelivr.net/npm/froala-editor@4.6.2/js/froala_editor.pkgd.min.js"></script>

</head>

<body>
    <form action="/submit" method="POST">
        <h3>Cadastre-se </h3>

    <div class="form-group">
        <label for="nome">Nome: </label>
        <input type="text" id="nome" name="nome" placeholder="Nome Completo">
    </div>

    <div class="form-group">
        <label for="data_nascimento">Data de Nascimento: </label>
        <input type="date" id="data_nascimento" name="data_nascimento">
    </div>

    <div class="form-group">
        <label>Gênero: </label>

        <label for="masculino">
            <input type="radio" id="masculino" name="genero" value="masculino">
            Masculino
        </label>

        <label for="feminino">
            <input type="radio" id="feminino" name="genero" value="feminino">
            Feminino
        </label>

        <label for="outro">
            <input type="radio" id="outro" name="genero" value="outro">
            Outro
        </label>
    </div>

    <div class="form-group">
        <label for="email">Email: </label>
        <input type="email" id="email" name="email">
    </div>

    <div class="form-group">
        <label for="telefone">Telefone: </label>
        <input type="tel" id="telefone" name="telefone" placeholder="(11) 99999-9999">
    </div>

    <div class="form-group">
        <label>Habilidades: </label>

        <label for="html">
            <input type="checkbox" id="html" name="habilidades" value="HTML">HTML
        </label>

        <label for="css">
            <input type="checkbox" id="css" name="habilidades" value="CSS">CSS
        </label>

        <label for="js">
            <input type="checkbox" id="js" name="habilidades" value="JS">JavaScript
        </label>
    </div>

    <div class="form-group">
        <label for="pais">País: </label>
        <select id="pais" name="pais">
            <option value="br">Brasil</option>
            <option value="cs">Coreia do Sul</option>
            <option value="it">Itália</option>
            <option value="jp">Japão</option>
            <option value="cn">Canadá</option>
            <option value="nz">Nova Zelândia</option>
        </select>
    </div>

    <div class="form-group">
        <label for="senha">Senha: </label>
        <input type="password" id="senha" name="senha">
    </div>

    <div class="form-group">
        <label for="comentarios">Comentários: </label><br>
        <textarea id="comentarios" name="comentarios"> </textarea>
    </div>

    <div class="form-group">
        <button type="submit">Enviar </button>
    </div>

</form>

<script>
    new FroalaEditor('#comentarios', {
        height: 200,
        placeholderText: 'Digite seus comentários aqui...'
    });
</script>

</body>

</html>
